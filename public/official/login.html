<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bantay Barangay Login</title>
    <link rel="stylesheet" href="logstyle.css">

</head>

<body>

    <div class="login-container">
        <header>
            <h1>Bantay Barangay Login</h1>

            <p>Your direct line to barangay officials.</p>
        </header>

        <main>

            <section class="login-section">
                <form id="loginForm">

                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                    <button type="submit" class="login">
                        Log In
                    </button>

                </form>

            </section>

        </main>

    </div>
    
</body>
